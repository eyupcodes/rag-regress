name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov

  # Dogfood the composite action on the example pipeline.
  action-pass:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: gate
        uses: ./
        with:
          golden: examples/golden.jsonl
          pipeline: examples.toy_rag:search
          baseline: examples/baseline.json
      - name: The unchanged pipeline must pass
        run: test "${{ steps.gate.outputs.passed }}" = "true"

  action-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          golden: examples/golden.jsonl
          pipeline: examples.toy_rag:search_without_bm25
          baseline: examples/baseline.json
          compare-args: --metric hit@5 --metric recall@5
          comment: "false"
      - name: The broken pipeline must be caught
        run: |
          test "${{ steps.gate.outcome }}" = "failure"
          test "${{ steps.gate.outputs.passed }}" = "false"
