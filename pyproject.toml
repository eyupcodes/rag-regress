[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-regress"
version = "0.1.0.dev0"
description = "Catch quality regressions in RAG pipelines before they merge: run a golden set, compare with a baseline, fail CI on drops."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eyüp Fidan" }]
keywords = ["rag", "retrieval", "evaluation", "regression-testing", "ci", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.13,<1",
]

[project.scripts]
rag-regress = "rag_regress.cli:app"

[project.urls]
Homepage = "https://github.com/eyupcodes/rag-regress"
Repository = "https://github.com/eyupcodes/rag-regress"
Issues = "https://github.com/eyupcodes/rag-regress/issues"
Changelog = "https://github.com/eyupcodes/rag-regress/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_regress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rag_regress"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
